 
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SouthScreen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial,sans-serif}
header{background:#20202d;padding:22px 15px;text-align:center}
h1{margin:0;color:#ff4242}
header p{color:#ccc}
.search{width:90%;max-width:500px;padding:14px;margin:15px auto;border-radius:10px;border:0;display:block;font-size:16px}
h2{padding:0 15px}
.movies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:15px}
.card{background:#222230;border-radius:12px;overflow:hidden}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.card h3{padding:0 10px;margin:12px 0 6px}
.card p{padding:0 10px;color:#ccc;font-size:14px}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>🎬 SouthScreen</h1>
<p>Telugu • Tamil • Kannada • Malayalam</p>
</header>
<input class="search" id="search" placeholder="Search movies..." oninput="searchMovies()">
<h2>Popular Movies</h2>
<div class="movies" id="movies">
<div class="card"><img src="https://placehold.co/300x450/252538/ffffff?text=Pushpa+2" alt="Pushpa 2 poster"><h3>Pushpa 2</h3><p>Telugu • Action</p></div>
<div class="card"><img src="https://placehold.co/300x450/252538/ffffff?text=Kalki+2898+AD" alt="Kalki poster"><h3>Kalki 2898 AD</h3><p>Telugu • Sci-Fi</p></div>
<div class="card"><img src="https://placehold.co/300x450/252538/ffffff?text=Leo" alt="Leo poster"><h3>Leo</h3><p>Tamil • Action</p></div>
<div class="card"><img src="https://placehold.co/300x450/252538/ffffff?text=Kantara" alt="Kantara poster"><h3>Kantara</h3><p>Kannada • Drama</p></div>
</div>
<footer>SouthScreen © 2026</footer>
<script>
function searchMovies(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(card=>{
card.style.display=card.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
